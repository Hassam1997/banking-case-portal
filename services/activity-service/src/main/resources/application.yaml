server:
  port: 8083

spring:
  application:
    name: activity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activitydb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    # MUST be identical to the other services
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes!!}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info