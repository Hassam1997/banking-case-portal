server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes!!}
    issuer: auth-service
    expiration-minutes: 30
  seed:
    enabled: true
    password: ${SEED_PASSWORD:Passw0rd!}

management:
  endpoints:
    web:
      exposure:
        include: health,info