server:
  port: 8082

spring:
  application:
    name: case-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/casedb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    # MUST be identical to auth-service, otherwise every token is rejected
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes!!}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  activity-service:
    url: ${ACTIVITY_SERVICE_URL:http://localhost:8083}  

management:
  endpoints:
    web:
      exposure:
        include: health,info