server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's built-in DNS. Names are re-resolved every 10 seconds.
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  location ~ ^/api/cases/[^/]+/activities {
    set $activity http://activity-service:8083;
    proxy_pass $activity;
  }
  location /api/auth/ {
    set $auth http://auth-service:8081;
    proxy_pass $auth;
  }
  location /api/cases {
    set $cases http://case-service:8082;
    proxy_pass $cases;
  }

  location / { try_files $uri /index.html; }
}