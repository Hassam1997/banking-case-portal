services:
  postgres:
    image: postgres:16
    container_name: bank-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./infra/docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/authdb
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SEED_PASSWORD: ${SEED_PASSWORD:-Passw0rd!}
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  case-service:
    build: ./services/case-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/casedb
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACTIVITY_SERVICE_URL: http://activity-service:8083
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  activity-service:
    build: ./services/activity-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/activitydb
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - case-service
      - activity-service
    restart: unless-stopped

volumes:
  pgdata: