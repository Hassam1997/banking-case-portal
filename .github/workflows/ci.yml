name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, case-service, activity-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify

  frontend:
    name: frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build

  docker:
    name: docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      AUTH_DB_PASSWORD: ci-auth-pw
      CASE_DB_PASSWORD: ci-case-pw
      ACTIVITY_DB_PASSWORD: ci-activity-pw
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Smoke test
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"agent1","password":"Passw0rd!"}' || true)
            [ "$code" = "200" ] && echo "login OK" && exit 0
            sleep 5
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v